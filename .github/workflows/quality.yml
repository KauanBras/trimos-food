name: Qualidade e produção

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: build-only-placeholder
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar código
        run: npm run lint

      - name: Compilar aplicação
        run: npm run build

  production-smoke:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium webkit

      - name: Aguardar publicação na Vercel
        run: curl --fail --silent --show-error --retry 24 --retry-delay 5 --retry-all-errors https://trimos-food.vercel.app/api/health

      - name: Testar produção em desktop e Safari móvel
        run: npm run test:e2e
        env:
          E2E_BASE_URL: https://trimos-food.vercel.app

  uptime:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar aplicação e base de dados
        run: curl --fail --silent --show-error --max-time 20 --retry 2 https://trimos-food.vercel.app/api/health

      - name: Verificar menu público
        run: curl --fail --silent --show-error --max-time 20 --retry 2 https://trimos-food.vercel.app/r/hirotatsu-sushi > /dev/null
